name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go ${{ matrix.go }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: 1.25.x
          - os: ubuntu-latest
            go: 1.27.x
          - os: macos-latest
            go: 1.27.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  contracts:
    name: API and protocol contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.x
          cache: false
      - name: Public API, manifests, and external consumer
        run: go test ./internal/contract ./compat/v1 ./feedback
      - name: Unsupported-platform code still compiles for host adapters
        run: GOOS=windows GOARCH=amd64 go build ./...
      - name: Module files are tidy
        run: |
          go mod tidy
          test -z "$(git status --porcelain -- go.mod go.sum)"
      - name: GitHub Actions workflows
        run: GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Static analysis
        run: GOWORK=off go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

  fuzz:
    name: Fuzz regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.x
          cache: false
      - run: make fuzz

  security:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.x
          cache: false
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  remote-consumer:
    name: Remote no-clone consumer
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.x
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Resolve and consume the exact remote commit without checkout
        env:
          REMOTE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          REMOTE_MODULE: github.com/timmyagentic/awesome-agent-app-features
          REMOTE_REPOSITORY: timmyagentic/awesome-agent-app-features
        run: |
          set -euo pipefail
          test "${#REMOTE_COMMIT}" -eq 40
          entry_url="https://raw.githubusercontent.com/${REMOTE_REPOSITORY}/${REMOTE_COMMIT}/features/index.json"
          entry="$(curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "${entry_url}")"
          jq -e '
            .delivery.user_clone_required == false and
            .resolution.immutable_ref == "full-commit-sha" and
            .resolution.required_ci == "CI" and
            .lock.host_path == "agent-app-features.lock.json" and
            .lock.validator_package == "github.com/timmyagentic/awesome-agent-app-features/cmd/feature-lock"
          ' <<<"${entry}" >/dev/null
          while IFS= read -r manifest; do
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "https://raw.githubusercontent.com/${REMOTE_REPOSITORY}/${REMOTE_COMMIT}/${manifest}" | jq -e '.contract == "v1" and .delivery != []' >/dev/null
          done < <(jq -r '.features[].manifest' <<<"${entry}")
          lock_schema="$(jq -r '.lock.schema_path' <<<"${entry}")"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "https://raw.githubusercontent.com/${REMOTE_REPOSITORY}/${REMOTE_COMMIT}/${lock_schema}" | jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema"' >/dev/null

          consumer_directory="$(mktemp -d)"
          archive_path="${consumer_directory}/foundation.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "https://api.github.com/repos/${REMOTE_REPOSITORY}/tarball/${REMOTE_COMMIT}" --output "${archive_path}"
          tar -tzf "${archive_path}" | grep -E '/relay/cloudflare/package.json$' >/dev/null
          test -z "$(tar -tzf "${archive_path}" | grep -E '(^|/)\.\.(/|$)' || true)"
          test -z "$(tar -tvzf "${archive_path}" | awk '$1 ~ /^l/ && $0 ~ /\/relay\/cloudflare\// { print }')"

          source_directory="${consumer_directory}/source"
          mkdir -p "${source_directory}"
          tar -xzf "${archive_path}" -C "${source_directory}" --strip-components=1

          sh "${source_directory}/scripts/verify-remote-consumer.sh" \
            "${REMOTE_MODULE}" \
            "${REMOTE_COMMIT}" \
            "${source_directory}" \
            "${consumer_directory}"

  relay:
    name: Feedback relay (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: relay/cloudflare/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --prefix relay/cloudflare --ignore-scripts
      - name: Unit, shared-fixture, and workerd tests
        run: |
          node --test internal/contract/relay_contract.test.mjs
          npm test --prefix relay/cloudflare
      - name: Syntax check
        run: npm run check --prefix relay/cloudflare
      - name: Generated bindings and type safety
        run: |
          npm run typecheck --prefix relay/cloudflare
          npm run types:check --prefix relay/cloudflare
      - name: Worker dry run
        run: npm run validate:worker --prefix relay/cloudflare
      - name: Dependency audit
        run: npm audit --prefix relay/cloudflare --audit-level=high
