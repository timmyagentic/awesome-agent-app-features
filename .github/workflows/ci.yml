name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  relay:
    name: Feedback relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: relay/cloudflare/package-lock.json
      - name: Install
        run: npm ci --prefix relay/cloudflare --ignore-scripts
      - name: Tests
        run: npm test --prefix relay/cloudflare
      - name: Syntax check
        run: npm run check --prefix relay/cloudflare
      - name: Worker dry run
        run: npm run validate:worker --prefix relay/cloudflare
